<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú</title>
    <link rel="stylesheet" href="../css/menu.css">
</head>

<body class="menu-body pantalla-menu">

    <!-- HEADER SUPERIOR -->
    <!-- BOTONES FLOTANTES (FUERA DEL HEADER) -->
    <button class="hamburger-btn" onclick="toggleSidebar()">.</button>
    <button class="btn-carrito" onclick="abrirCarrito()">.</button>

    <!-- OVERLAY OSCURO -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- MENÚ LATERAL DE CATEGORÍAS -->
    <aside id="sidebar" class="sidebar">
        <h2 class="sidebar-title">Categorías</h2>
        <div id="lista-categorias" class="sidebar-categorias"></div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="menu-content">

        <!-- TÍTULO -->
        <h2 class="titulo-menu">Menú</h2>
        <p class="linea-separacion"> ------ </p>
        <p class="subtitulo-menu">
            Descubre todos nuestros productos<br>
            y agrega los que quieras al carrito para realizar tu pedido fácilmente.
        </p>


        

        <!-- BANNER PRINCIPAL -->
        <div class="banner-principal">
            <img src="../img/banner.png" alt="Promoción del día" class="banner-img">
        </div>

        <!-- TODOS LOS PRODUCTOS -->
        <section>
            <h2 class="seccion-titulo">Todos los productos</h2>
            <div id="lista-productos" class="productos-grid"></div>
        </section>

    </main>

    <script src="../js/script.js"></script>

    <script>
    document.getElementById('sidebar-overlay').addEventListener('click', cerrarSidebar);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') cerrarSidebar();
    });
    </script>

</body>
</html>
