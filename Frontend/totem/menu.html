<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="menu-body pantalla-menu">

    <!-- HEADER SUPERIOR -->
    <header class="menu-header">
        <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
        <h1 class="logo-menu">🍔 Menú</h1>
        <button class="btn-carrito" onclick="abrirCarrito()">🛒</button>
    </header>

    <!-- OVERLAY OSCURO -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- MENÚ LATERAL DE CATEGORÍAS -->
    <aside id="sidebar" class="sidebar">
        <h2 class="sidebar-title">Categorías</h2>
        <div id="lista-categorias" class="sidebar-categorias"></div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="menu-content">

        <!-- BANNER PRINCIPAL -->
        <div class="banner-principal">
            <img src="../img/banner.jpg" alt="Promoción del día" class="banner-img">
        </div>

        <!-- SUGERENCIAS -->
        <section>
            <h2 class="seccion-titulo">Sugerencias de hoy</h2>
            <div id="sugerencias" class="productos-grid"></div>
        </section>

        <!-- TODOS LOS PRODUCTOS -->
        <section>
            <h2 class="seccion-titulo">Todos los productos</h2>
            <div id="lista-productos" class="productos-grid"></div>
        </section>

    </main>

    <script src="../js/script.js"></script>

    <script>
    // Click en overlay para cerrar
    document.getElementById('sidebar-overlay').addEventListener('click', cerrarSidebar);
    
    // ESC para cerrar
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') cerrarSidebar();
    });
</script>


</body>
</html>
