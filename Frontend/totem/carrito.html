<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Mi Pedido</title>
    <link rel="stylesheet" href="../css/carrito.css">
</head>

<body class="pantalla-carrito">

    <div class="carrito-contenedor">

        <!-- Botón volver -->
        <a href="menu.html" class="btn-volver">← Volver al menú</a>

        <!-- Título -->
        <h1 class="titulo-carrito">🛒 Tu pedido</h1>
        
        <!-- Nombre del cliente -->
        <div class="nombre-cliente-container">
            <label for="nombre-cliente">¿Cuál es tu nombre? <span style="color: red;">*</span></label>
            <input 
                type="text" 
                id="nombre-cliente" 
                placeholder="Ingresá tu nombre" 
                maxlength="50"
                required
            >
        </div>

        <!-- Lista de productos en el carrito -->
        <div id="lista-carrito" class="carrito-items">
            <div style="text-align: center; padding: 40px; color: #999;">
                <p>⏳ Cargando carrito...</p>
            </div>
        </div>

        <!-- Observaciones generales del pedido -->
        <div class="observaciones-generales-container">
            <label for="observaciones-generales">
                <strong>📝 Observaciones del pedido (opcional):</strong>
            </label>
            <textarea 
                id="observaciones-generales" 
                placeholder="Ej: Sin cebolla en la hamburguesa, papas bien cocidas, entregar en recepción..."
                rows="4"
                maxlength="300"
            ></textarea>
            <small class="observaciones-hint">
                💡 Acá podés indicar cualquier detalle especial de tu pedido (máx. 300 caracteres)
            </small>
        </div>



       <!-- RESUMEN STICKY (COLUMNA DERECHA) -->
        <div class="carrito-resumen">
            <h2>Resumen</h2>
            <div class="resumen-detalle">
                <div class="resumen-item">
                    <span>Productos:</span>
                    <span id="resumen-cantidad">0</span>
                </div>
                <div class="resumen-item total">
                    <span>TOTAL A PAGAR</span>
                    <span class="precio-total">$<span id="total-precio">0</span></span>
                </div>
            </div>
            <button class="btn-confirmar" id="btn-confirmar">
                ✅ Confirmar Pedido
            </button>
        </div>

    </div>

    <!-- Script exclusivo del carrito -->
    <script src="../js/carrito.js"></script>
</body>
</html>
