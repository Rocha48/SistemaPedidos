<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="pantalla-detalle">

    <div class="detalle-contenedor">

        <!-- Botón para volver al menú -->
        <a href="menu.html" class="btn-volver">← Volver</a>

        <!-- Imagen del producto -->
        <img id="detalle-img" class="detalle-img" src="" alt="Producto">

        <!-- Texto del producto -->
        <h1 id="detalle-nombre"></h1>
        <p id="detalle-descripcion"></p>
        <p class="detalle-precio">Precio: $<span id="detalle-precio"></span></p>

        <!-- Cantidad -->
        <div class="cantidad-container">
            <button id="btn-restar" class="btn-cantidad">–</button>
            <span id="cantidad">1</span>
            <button id="btn-sumar" class="btn-cantidad">+</button>
        </div>


        <!-- Botón agregar al carrito -->
        <button id="btn-agregar" class="btn-agregar">Agregar al pedido</button>

    </div>

    <script src="../js/script.js"></script>
</body>
</html>
