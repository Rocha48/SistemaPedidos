<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipo de Pedido</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="pedido-container">
    <div class="pedido-box">
        <h1 class="pedido-title">¿Qué deseas hacer?</h1>
        <p class="pedido-subtitulo"> - Selecciona cómo prefieres recibir tu pedido - </p>
        
        <div class="pedido-opciones">
            <button class="btn-tipo-pedido-local" onclick="seleccionarTipo('local')">
                Local
            </button>
            <button class="btn-tipo-pedido-llevar" onclick="seleccionarTipo('llevar')">
                Para llevar
            </button>
        </div>
    </div>

    <script src="../js/tipoPedido.js"></script>
</body>
</html>
