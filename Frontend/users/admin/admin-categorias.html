<script>
    if (!localStorage.getItem("token")) {
        window.location.href = "../../admin-login.html";
    }
</script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Categorías</title>
    <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body class="admin-panel-body admin-categorias-body">


    <!-- SIDEBAR FIJO -->
    <aside class="admin-sidebar">

        <div class="sidebar-user">
            <div class="sidebar-user-icon">👤</div>
            <p id="sidebar-username">Administrador</p>
        </div>

        <nav class="sidebar-nav">
            <a href="admin-panel.html">🏠 Inicio</a>
            <a href="admin-mesas.html">📦 Mesas</a>
            <a href="admin-platos.html">🍔 Platos</a>
            
            <a href="admin-usuarios.html">👤 Usuarios</a>
            
        </nav>

        <button class="sidebar-logout" onclick="cerrarSesion()">⛔ Cerrar sesión</button>
    </aside>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="admin-main">

        <header class="admin-header">
            <button class="menu-mobile-btn" onclick="toggleMenuMobile()">☰</button>
            <h1>📂 Gestión de Categorías</h1>
            <a href="admin-panel.html" class="btn-volver">⬅ Volver</a>
        </header>

        <div class="admin-categorias-container">

            <!-- FORMULARIO -->
            <div class="card-form">
                <h2 id="titulo-form">Crear Categoría</h2>

                <input type="text" id="nombre-categoria" placeholder="Nombre de la categoría">

                <button id="btn-guardar" onclick="guardarCategoria()">Guardar</button>
                <button id="btn-cancelar" class="btn-secundario oculto" onclick="cancelarEdicion()">Cancelar</button>
            </div>

            <!-- LISTADO -->
            <div class="card-lista">
                <h2>Listado de Categorías</h2>

                <table class="tabla-admin">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Opciones</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-categorias">
                        <!-- CATEGORÍAS AQUÍ -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../../js/script.js"></script>


    <!-- MODAL DE CERRAR SESIÓN -->
    <div id="modalLogout" class="modal-logout oculto">
        <div class="modal-content-logout">
            <h3>¿Cerrar sesión?</h3>
            <p>¿Estás seguro que deseas cerrar tu sesión?</p>

            <div class="modal-btns">
                <button id="logout-confirm" class="btn-confirmar">Sí, cerrar</button>
                <button id="logout-cancel" class="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>


    <!-- SIDEBAR MÓVIL -->
    <div id="sidebarMobile" class="sidebar-mobile oculto">

        <div class="sidebar-mobile-content">

            <div class="sidebar-user">
                <div class="sidebar-user-icon">👤</div>
                <p>Administrador</p>
            </div>

            <nav class="sidebar-nav">
                <a href="admin-panel.html">🏠 Inicio</a>
                <a href="admin-mesas.html">📦 Mesas</a>
                <a href="admin-platos.html">🍔 Platos</a>
                
                <a href="admin-usuarios.html">👤 Usuarios</a>
                
            </nav>

            <button class="sidebar-logout" onclick="cerrarSesion()">⛔ Cerrar sesión</button>

        </div>
    </div>

</body>
</html>
